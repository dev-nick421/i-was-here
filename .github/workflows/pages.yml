name: Deploy to GitHub Pages

# A live copy of the editor at https://<owner>.github.io/<repo>/. GitHub Pages only serves
# files, so this is the static build: settings are baked in and place search goes from the
# browser straight to Photon (there's no server for /api/geocode).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the static app
        run: pnpm generate
        env:
          # "/<repo>" for a project site, empty with a custom domain
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          NUXT_PUBLIC_PHOTON_URL: https://photon.komoot.io/api/
      - name: Check the output
        run: |
          cd .output/public
          grep -q '${{ steps.pages.outputs.base_path }}/_nuxt/' index.html
          grep -q '__IWH_BUILD' sw.js
          grep -q '"start_url"' manifest.webmanifest
          test -f 404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
